services:
  db:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: root
    volumes:
      - delivery_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  delivery_pgdata: